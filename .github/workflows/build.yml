# Builds the mod on every push and pull request.
# When a GitHub release is published (or the workflow is started manually with a
# release tag), the jars are also attached to that release and uploaded to Modrinth.
# The Minecraft and mod versions are read from gradle.properties, so this file is
# identical on every version branch.

name: build
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to Modrinth (e.g. 1.1.0+26.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

      - name: read release info
        id: info
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "$TAG" != "$mod_version" ]; then
            echo "::error::Tag $TAG does not match mod_version $mod_version in gradle.properties"
            exit 1
          fi
          gh release view "$TAG" --json body -q .body > changelog.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"
      - name: attach jars to github release
        if: steps.info.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.info.outputs.tag }}" build/libs/*.jar --clobber
      - name: publish to modrinth
        if: steps.info.outcome == 'success'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: a9iNUSGE
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-sources).jar
          name: Warper ${{ steps.info.outputs.mod_version }}
          version: ${{ steps.info.outputs.mod_version }}
          version-type: release
          changelog-file: changelog.md
          loaders: fabric
          game-versions: ${{ steps.info.outputs.minecraft_version }}
          environment: server | singleplayer
          dependencies: fabric-api(required){modrinth:P7dR8mSH}
